<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Validation Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .terminal-container {
            background: #000;
            border-radius: 20px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .terminal-header {
            color: #fff;
            margin-bottom: 40px;
        }
        .terminal-header h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .terminal-header p {
            font-size: 16px;
            color: #999;
            margin: 0;
        }
        .status-display {
            background: #111;
            border-radius: 15px;
            padding: 50px 30px;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .status-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .status-text {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .status-valid {
            color: #27AE60;
        }
        .status-invalid {
            color: #E74C3C;
        }
        .balance-display {
            font-size: 48px;
            font-weight: 700;
            color: #3498DB;
            margin-top: 20px;
        }
        .fare-display {
            font-size: 42px;
            font-weight: 700;
            color: #F39C12;
            margin-top: 15px;
        }
        .distance-display {
            font-size: 24px;
            color: #95A5A6;
            margin-top: 15px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-terminal {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-tap-in {
            background: #27AE60;
            color: white;
        }
        .btn-tap-in:hover {
            background: #229954;
            transform: scale(1.05);
        }
        .btn-tap-out {
            background: #3498DB;
            color: white;
        }
        .btn-tap-out:hover {
            background: #2980B9;
            transform: scale(1.05);
        }
        .btn-reset {
            background: #7F8C8D;
            color: white;
        }
        .btn-reset:hover {
            background: #5D6D7E;
        }
        .info-text {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <h1><i class="fas fa-bus"></i> Fare Validation Terminal</h1>
            <p>Tap your card to validate</p>
        </div>

        <div class="status-display" id="statusDisplay">
            <div class="status-icon" id="statusIcon">
                <i class="fas fa-credit-card"></i>
            </div>
            <div class="status-text" id="statusText">Ready</div>
            <div id="additionalInfo"></div>
        </div>

        <div class="action-buttons">
            <button class="btn-terminal btn-tap-in" onclick="simulateTapIn()">
                <i class="fas fa-sign-in-alt"></i> Tap In
            </button>
            <button class="btn-terminal btn-tap-out" onclick="simulateTapOut()">
                <i class="fas fa-sign-out-alt"></i> Tap Out
            </button>
            <button class="btn-terminal btn-reset" onclick="resetTerminal()">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>

        <div class="info-text">
            <p>Click buttons to simulate card tap</p>
        </div>
    </div>

    <script>
        let isTappedIn = false;
        let currentBalance = 250.00;
        const fareAmount = 15.00;

        function simulateTapIn() {
            // Simulate validation
            const isValid = currentBalance >= fareAmount;
            
            const statusDisplay = document.getElementById('statusDisplay');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const additionalInfo = document.getElementById('additionalInfo');

            if (isValid) {
                statusDisplay.style.background = 'rgba(39, 174, 96, 0.1)';
                statusIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
                statusIcon.style.color = '#27AE60';
                statusText.textContent = 'VALID';
                statusText.className = 'status-text status-valid';
                additionalInfo.innerHTML = `
                    <div class="balance-display">Balance: ₱${currentBalance.toFixed(2)}</div>
                `;
                isTappedIn = true;
            } else {
                statusDisplay.style.background = 'rgba(231, 76, 60, 0.1)';
                statusIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
                statusIcon.style.color = '#E74C3C';
                statusText.textContent = 'INVALID';
                statusText.className = 'status-text status-invalid';
                additionalInfo.innerHTML = `
                    <div style="color: #E74C3C; font-size: 20px; margin-top: 15px;">
                        Insufficient Balance
                    </div>
                    <div class="balance-display" style="color: #E74C3C; font-size: 32px; margin-top: 10px;">
                        Balance: ₱${currentBalance.toFixed(2)}
                    </div>
                `;
            }
        }

        function simulateTapOut() {
            if (!isTappedIn) {
                alert('Please tap in first!');
                return;
            }

            // Calculate distance (random for demo)
            const distance = (Math.random() * 10 + 2).toFixed(2);
            
            // Deduct fare
            currentBalance -= fareAmount;
            isTappedIn = false;

            const statusDisplay = document.getElementById('statusDisplay');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const additionalInfo = document.getElementById('additionalInfo');

            statusDisplay.style.background = 'rgba(52, 152, 219, 0.1)';
            statusIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
            statusIcon.style.color = '#3498DB';
            statusText.textContent = 'TAP OUT SUCCESSFUL';
            statusText.className = 'status-text';
            statusText.style.color = '#3498DB';
            additionalInfo.innerHTML = `
                <div class="fare-display">Fare Deducted: ₱${fareAmount.toFixed(2)}</div>
                <div class="distance-display">Distance Travelled: ${distance} km</div>
                <div class="balance-display" style="font-size: 36px; margin-top: 20px;">
                    Remaining Balance: ₱${currentBalance.toFixed(2)}
                </div>
            `;
        }

        function resetTerminal() {
            isTappedIn = false;
            const statusDisplay = document.getElementById('statusDisplay');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const additionalInfo = document.getElementById('additionalInfo');

            statusDisplay.style.background = '#111';
            statusIcon.innerHTML = '<i class="fas fa-credit-card"></i>';
            statusIcon.style.color = '#95A5A6';
            statusText.textContent = 'Ready';
            statusText.className = 'status-text';
            statusText.style.color = '#95A5A6';
            additionalInfo.innerHTML = '';
        }
    </script>
</body>
</html>
