<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Jeep Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fas fa-bus"></i>
                <h1>E-Jeep Manager</h1>
            </div>
            
            <div class="role-selector">
                <button class="role-btn active" data-role="admin">
                    <i class="fas fa-user-shield"></i>
                    Admin/Operator
                </button>
                <button class="role-btn" data-role="driver">
                    <i class="fas fa-id-card"></i>
                    Driver
                </button>
                <button class="role-btn" data-role="commuter">
                    <i class="fas fa-user"></i>
                    Commuter
                </button>
            </div>

            <form id="loginForm" class="auth-form">
                <h2>Login</h2>
                
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div id="twoFactorForm" class="auth-form hidden">
                <h2>Two-Step Verification</h2>
                <p class="form-description">Enter the verification code sent to your email/phone</p>
                
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                </div>
                
                <button class="btn btn-primary btn-block">
                    <i class="fas fa-check"></i> Verify
                </button>
                
                <p class="switch-form">
                    Didn't receive code? <a href="#">Resend</a>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
